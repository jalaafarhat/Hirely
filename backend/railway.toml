[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Migrations must run on every start — Railway startCommand overrides Dockerfile CMD
startCommand = "sh -c 'npx prisma migrate deploy && exec node dist/src/main.js'"
